name: desktop-shots

# Builds the Linux desktop client (test/desktop-linux/Dockerfile) and runs
# test/desktop-linux/shots.sh: the real window on Xvfb, the bundled aas sidecar
# behind Tauri IPC, the catalog from an API this job starts (scripts/ci-catalog-api.sh;
# the deployed test environment is not read, #211). Then test/desktop-linux/appimage.sh
# in a fresh container: the AppImage's sidecar, scheme registration and an
# install link. test/desktop-linux/marketing.sh, in another fresh container, takes the
# website's client screenshots in Chinese and English. The screenshots and the on-disk
# checks are uploaded as the `desktop-shots` artifact.
on:
  pull_request:
    paths:
      - 'apps/cli-gui/**'
      - 'apps/cli/**'
      - 'apps/client-core/**'
      - 'packages/**'
      - 'test/desktop-linux/**'
      - 'apps/api/**'
      - 'scripts/ci-catalog-api.sh'
      - '.github/workflows/desktop-shots.yml'
  workflow_dispatch:

concurrency:
  group: desktop-shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    # A compiler upgrade invalidates build layers before the full native acceptance.
    timeout-minutes: 75
    env:
      # The containers reach the API started on the runner through the host gateway.
      CATALOG: http://host.docker.internal:3001
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the Linux client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: test/desktop-linux/Dockerfile
          tags: as-desktop-linux
          load: true
          cache-from: type=gha,scope=desktop-linux
          cache-to: type=gha,scope=desktop-linux,mode=max
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          tags: as-api:ci
          load: true
          # Reads the cache images.yml writes; does not write its own.
          cache-from: type=gha,scope=api
      - name: Start the catalog API
        run: scripts/ci-catalog-api.sh as-api:ci 3001
      - name: First-launch restore (Chinese and English)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p out/first-launch
          docker run --rm --shm-size 1g --add-host=host.docker.internal:host-gateway -e AS_STORE_URL="$CATALOG" -v "$PWD/out/first-launch:/out/first-launch" --entrypoint bash as-desktop-linux /work/test/desktop-linux/first-launch.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-launch-restore
          path: out/first-launch/
          retention-days: 14
      - name: Disconnect repaint probe
        if: ${{ !cancelled() }}
        # Measurements, not checks (#233): see test/desktop-linux/disconnect-probe.sh.
        run: |
          mkdir -p out
          docker run --rm --shm-size 1g --add-host=host.docker.internal:host-gateway -e AS_STORE_URL="$CATALOG" -e MOCK_UPSTREAM="$CATALOG" -v "$PWD/out:/out" --entrypoint bash as-desktop-linux /work/test/desktop-linux/disconnect-probe.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: disconnect-probe
          path: out/probe/
          retention-days: 14
      - name: Screenshots of the native window
        if: ${{ !cancelled() }}
        run: |
          mkdir -p out
          docker run --rm --shm-size 1g --add-host=host.docker.internal:host-gateway -e AS_STORE_URL="$CATALOG" -e MOCK_UPSTREAM="$CATALOG" -v "$PWD/out:/out" --entrypoint bash as-desktop-linux /work/test/desktop-linux/shots.sh
      - name: Marketing screenshots
        if: ${{ !cancelled() }}
        run: |
          mkdir -p out/marketing
          docker run --rm --shm-size 1g --add-host=host.docker.internal:host-gateway -e AS_STORE_URL="$CATALOG" -e MOCK_UPSTREAM="$CATALOG" -e OUT=/out/marketing -v "$PWD/out:/out" --entrypoint bash as-desktop-linux /work/test/desktop-linux/marketing.sh
      - name: AppImage
        if: ${{ !cancelled() }}
        run: |
          mkdir -p out/appimage
          docker run --rm --shm-size 1g --add-host=host.docker.internal:host-gateway -e AS_STORE_URL="$CATALOG" -e MOCK_UPSTREAM="$CATALOG" -e OUT=/out/appimage -v "$PWD/out:/out" --entrypoint bash as-desktop-linux /work/test/desktop-linux/appimage.sh
      - name: Result
        if: always()
        run: |
          cat out/probe/env.txt out/probe/result.txt out/result.txt out/marketing/result.txt out/appimage/result.txt || true
          docker logs catalog-api > out/catalog-api.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-shots
          path: out/
          retention-days: 14
