name: test-env-reachable

# Whether the deployed test environment (home-lab, projects/agent-store/test) answers.
# desktop-shots and store-screenshots read the catalog from an API they start themselves
# (#211), so an outage or a deploy shows here and does not fail their product checks.
# One request per endpoint, no retries: a failure here is the signal.
# latency-budget times the same environment (#216). It fails only on the schedule and
# on a manual run: on a pull request it reports, since the time is spent in the
# deployment and the network, not in the change under review.
on:
  pull_request:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-env-reachable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_URL: https://agent-store.tail1eafd1.ts.net
    steps:
      # The test environment is only reachable on the tailnet (home-lab svc:agent-store).
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:agent-store-ci
      - name: Catalog API, web store and sign-in answer
        run: |
          failed=0
          for path in '/api/resources?limit=1' /store /api/auth/ok; do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$TEST_URL$path") || true
            echo "$(date -u +%H:%M:%SZ) $status $TEST_URL$path"
            [ "$status" = 200 ] || failed=1
          done
          exit $failed

  latency-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The test environment is only reachable on the tailnet (home-lab svc:agent-store).
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:agent-store-ci
      - name: First byte and total time within budget
        env:
          ENFORCE: ${{ github.event_name == 'pull_request' && '0' || '1' }}
        run: scripts/latency-budget.sh https://agent-store.tail1eafd1.ts.net
